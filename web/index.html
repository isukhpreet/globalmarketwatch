<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlobalMarketWatch · System status</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>GlobalMarketWatch</h1>
  <span id="env" class="pill"></span>
  <span class="muted" id="updated"></span>
</header>

<main>
  <section class="cards">
    <div class="card"><div class="label">Status</div><div class="value" id="health">…</div></div>
    <div class="card"><div class="label">Version</div><div class="value" id="version">…</div></div>
    <div class="card"><div class="label">Uptime</div><div class="value" id="uptime">…</div></div>
    <div class="card"><div class="label">Database schema</div><div class="value" id="schema">…</div></div>
  </section>

  <section>
    <h2>Background jobs</h2>
    <table id="collectors"><thead><tr><th>Job</th><th>Last success</th><th>Last error</th><th>Detail</th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>Integrations</h2>
    <p class="muted">Connected once the matching key is added to the server's <code>.env</code> file.</p>
    <div id="integrations" class="chips"></div>
  </section>

  <section>
    <h2>Core watchlist</h2>
    <p class="muted">Live prices arrive in phase 4.</p>
    <table id="watchlist"><thead><tr><th>Instrument</th><th>Type</th><th>Region</th><th>Watchlist entry</th></tr></thead><tbody></tbody></table>
  </section>
</main>

<script>
const fmtAge = iso => {
  if (!iso) return "—";
  const s = Math.round((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  return new Date(iso).toLocaleString();
};
const fmtUptime = s => s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m`;
const esc = v => String(v ?? "—").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function refresh() {
  try {
    const r = await fetch("/api/status");
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    document.getElementById("health").innerHTML = '<span class="ok">● Running</span>';
    document.getElementById("version").textContent = d.version;
    document.getElementById("uptime").textContent = fmtUptime(d.uptime_seconds);
    document.getElementById("schema").textContent = `v${d.schema_version}`;
    document.getElementById("env").textContent = d.env;
    document.querySelector("#collectors tbody").innerHTML = d.collectors.map(c =>
      `<tr><td>${esc(c.name)}</td><td>${fmtAge(c.last_success)}</td><td>${c.last_error ? `<span class="err">${fmtAge(c.last_error)}</span>` : "—"}</td><td>${esc(c.detail || c.last_error_msg)}</td></tr>`).join("");
    document.getElementById("integrations").innerHTML = Object.entries(d.integrations).map(([k, on]) =>
      `<span class="chip ${on ? "on" : ""}">${on ? "✓" : "○"} ${esc(k)}</span>`).join("");
    document.querySelector("#watchlist tbody").innerHTML = d.watchlist.map(w =>
      `<tr><td>${esc(w.name)} <span class="muted">${esc(w.key)}</span></td><td>${esc(w.asset_class)}</td><td>${esc(w.region)}</td><td>${esc(w.entry_type)}</td></tr>`).join("");
    document.getElementById("updated").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById("health").innerHTML = '<span class="err">● Unreachable</span>';
  }
}
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
